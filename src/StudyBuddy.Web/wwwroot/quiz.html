<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy - Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-container {
            max-width: 700px;
            margin: 40px auto;
        }

        .question {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .option:hover {
            border-color: #3b5bdb;
            background: #f1f3ff;
        }

        .progress {
            color: #868e96;
            margin-bottom: 10px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #3b5bdb;
            text-align: center;
        }

        .detail {
            padding: 10px;
            border-left: 4px solid #dee2e6;
            margin-bottom: 8px;
            background: white;
        }

        .detail.ok { border-color: #2f9e44; }
        .detail.ko { border-color: #e03131; }
    </style>
</head>
<body>
    <div class="header">
        <h2>📚 StudyBuddy</h2>
        <div><a href="index.html">Home</a></div>
    </div>

    <div class="quiz-container">
        <div id="quiz">Caricamento...</div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
