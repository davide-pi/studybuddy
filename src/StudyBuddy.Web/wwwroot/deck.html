<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>StudyBuddy - Mazzo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/utils.js"></script>
</head>
<body>
    <div class="header">
        <h2>📚 StudyBuddy</h2>
        <div><a href="index.html">Home</a> <a href="stats.html">Statistiche</a></div>
    </div>

    <div class="container">
        <h1 id="title"></h1>
        <p id="desc"></p>

        <div class="box">
            <h3>Aggiungi carta</h3>
            <input id="front" placeholder="Fronte (domanda)" style="width: 300px">
            <input id="back" placeholder="Retro (risposta)" style="width: 300px">
            <button class="btn" id="btnAddCard">Aggiungi</button>
        </div>

        <div class="box">
            <h3>Aggiungi domanda al quiz</h3>
            <input id="domanda" placeholder="Domanda" style="width: 600px"><br>
            <input id="op1" placeholder="Opzione 1">
            <input id="op2" placeholder="Opzione 2">
            <input id="op3" placeholder="Opzione 3">
            <input id="op4" placeholder="Opzione 4"><br>
            Risposta corretta:
            <select id="corretta">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
            <button class="btn" id="btnAddQuestion">Aggiungi domanda</button>
        </div>

        <div class="box">
            <h3>Carte (<span id="count">0</span>)</h3>
            <div id="cards"></div>
        </div>

        <button class="btn btn-red" id="btnDelete">Elimina mazzo</button>
    </div>

    <script type="module" src="js/deck.js"></script>
</body>
</html>
