<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>StudyBuddy - Mazzo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/utils.js"></script>
</head>
<body>
    <div class="header">
        <h2>📚 StudyBuddy</h2>
        <div><a href="index.html">Home</a></div>
    </div>

    <div class="container">
        <h1 id="title"></h1>
        <div class="box">
            <h3>Aggiungi carta</h3>
            <input id="front" placeholder="Fronte (domanda)" style="width: 300px">
            <input id="back" placeholder="Retro (risposta)" style="width: 300px">
            <button class="btn" onclick="addCard()">Aggiungi</button>
        </div>
        <div class="box" id="cards"></div>
        <button class="btn btn-red" onclick="deleteDeck()">Elimina mazzo</button>
    </div>

    <script>
        checkLogin();
        var id = getParam("id");

        function load() {
            fetch("/api/decks/" + id).then(r => r.json()).then(d => {
                document.getElementById("title").innerText = d.name;
                var html = "";
                d.cards.forEach(c => {
                    html += '<div class="card-row"><span><b>' + c.front + '</b> → ' + c.back + '</span>';
                    html += '<button class="btn btn-red" onclick="delCard(' + c.id + ')">X</button></div>';
                });
                document.getElementById("cards").innerHTML = html;
            });
        }

        function addCard() {
            fetch("/api/decks/" + id + "/cards", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ front: document.getElementById("front").value, back: document.getElementById("back").value })
            }).then(() => load());
        }

        function delCard(cid) {
            fetch("/api/cards/" + cid, { method: "DELETE" }).then(() => load());
        }

        function deleteDeck() {
            if (confirm("Sicuro?")) {
                fetch("/api/decks/" + id, { method: "DELETE" }).then(() => window.location.href = "index.html");
            }
        }

        load();
    </script>
</body>
</html>
